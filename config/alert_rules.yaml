alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602418
    user_impact: Users wait longer than the latency SLO for answers.
    runbook: docs/alerts.md#alert-1
  - name: HighRequestErrorRate
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602418
    user_impact: More than 2% of users do not receive an answer.
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccess
    severity: warning
    condition: 'count(tool_success == true) / count(tool_success != null) * 100 < 90'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602418
    user_impact: Answers may lack relevant context or requests may fail during retrieval.
    runbook: docs/alerts.md#alert-3
